name: hasicx
description: "Where Music Sparks Vibe"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get: ^4.6.6
  permission_handler: ^12.0.1
  just_audio: ^0.10.5
  on_audio_query: ^2.9.0

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  just_audio_background: ^0.0.1-beta.14
  google_mobile_ads: ^8.0.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  go_router: ^17.2.1
  change_package_name: ^1.1.0
  get_it: ^9.2.1
  marquee: ^2.3.0
  fluttertoast: ^9.0.0
  fpdart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
     - family: Display
       fonts:
         - asset: assets/fonts/CreatoDisplay-Regular.otf
         - asset: assets/fonts/CreatoDisplay-Medium.otf
         - asset: assets/fonts/CreatoDisplay-Bold.otf
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-Light.ttf
         - asset: assets/fonts/Poppins-Regular.ttf
         - asset: assets/fonts/Poppins-Medium.ttf
         - asset: assets/fonts/Poppins-SemiBold.ttf
         - asset: assets/fonts/Poppins-Bold.ttf